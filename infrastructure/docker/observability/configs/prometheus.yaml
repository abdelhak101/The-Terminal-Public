global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'redpanda'
    static_configs:
      - targets: ['redpanda:9644']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888', 'otel-collector:8889']

  - job_name: 'terminal-observer'
    static_configs:
      - targets: ['observer:8000']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'streaming-monitor'
    static_configs:
      - targets: ['streaming-monitor:8000']

  - job_name: 'streaming-analytics'
    static_configs:
      - targets: ['streaming-analytics:8000']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
