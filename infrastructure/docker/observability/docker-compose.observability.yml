name: the-terminal

include:
  - path: ../storage/docker-compose.storage.yml

services:
  loki:
    image: grafana/loki:latest
    container_name: terminal-loki
    volumes:
      - ./configs/loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - the-terminal-network
    ports:
      - "23100:3100"

  promtail:
    image: grafana/promtail:latest
    container_name: terminal-promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./configs/promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - the-terminal-network
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:latest
    container_name: terminal-prometheus
    volumes:
      - ./configs/prometheus.yaml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - the-terminal-network
    ports:
      - "29090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: terminal-grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./configs/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./dashboards:/etc/grafana/dashboards
    networks:
      - the-terminal-network
    ports:
      - "23000:3000"
    depends_on:
      - loki
      - prometheus

  observer:
    build:
      context: ../../../
      dockerfile: services/observer/Dockerfile
    container_name: terminal-observer
    env_file:
      - ../../../.env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin_password}
      - OBSERVER_INTERVAL=60
      - METRICS_PORT=8000
    ports:
      - "28082:8000"
    networks:
      - the-terminal-network
    depends_on:
      - postgres
      - prometheus

  streaming-monitor:
    build:
      context: ../../../
      dockerfile: services/streaming-monitor/Dockerfile
    container_name: terminal-streaming-monitor
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - MONITORED_TOPICS=market.yahoo
      - METRICS_PORT=8000
    networks:
      - the-terminal-network
    depends_on:
      - prometheus

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: terminal-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./configs/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    networks:
      - the-terminal-network
    ports:
      - "24317:4317" # OTLP gRPC
      - "24318:4318" # OTLP HTTP
      - "28888:8888" # Prometheus metrics exposed by the collector
      - "28889:8889" # Prometheus exporter metrics

  dozzle:
    image: amir20/dozzle:latest
    container_name: terminal-dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - the-terminal-network
    ports:
      - "28881:8080"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: terminal-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - the-terminal-network
    privileged: true
    devices:
      - /dev/kmsg
    ports:
      - "28081:8080"

networks:
  the-terminal-network:
    name: the-terminal-network
    external: true

volumes:
  grafana_data:
    name: the-terminal-grafana-data
