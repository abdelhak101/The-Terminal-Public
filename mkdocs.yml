site_name: The Terminal Documentation
theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Operational Playbooks: guides/playbooks/
  - Service Architecture: technical/services/
  - Data Intelligence: technical/data/
  - Maintenance Hub: guides/maintenance/
  - System Evolution: features/history/
  - Global Index: sitemap.md
  - Resources:
      - Getting Started: guides/getting-started.md
      - Adapters: adapters/
      - Examples: examples/
  - Current Features: features/

plugins:
  - search
  - mermaid2

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
